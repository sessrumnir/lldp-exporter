---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks dir --redact --no-banner .
        pass_filenames: false
        always_run: true

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 4fda87d7a88af8155a135f9bd6ffa10c1c0a3fa4 # frozen: 44.155.2
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0 # frozen: v0.49.1
    hooks:
      - id: markdownlint
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # frozen: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/bridgecrewio/checkov
    rev: 0f2f7cdf16dc0b71f06e2d33bef097ae1f960446 # frozen: 3.3.28
    hooks:
      - id: checkov
        files: (^|/)Containerfile$
        args:
          - --framework=dockerfile
          - --quiet
          - --compact
