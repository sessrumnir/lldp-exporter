---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: d25b2b1dc80689fb633f21f6978bba69871181d3 # frozen: v1.31.0
    hooks:
      - id: zizmor

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks dir --redact --no-banner .
        pass_filenames: false
        always_run: true

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: aa63b818cbe95b265dbaf9a9d5f5dfa26922c380 # frozen: 44.164.6
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0 # frozen: v0.49.1
    hooks:
      - id: markdownlint
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/bridgecrewio/checkov
    rev: e40023ab262c7c8b7b0a8f0975072b42d1b601f9 # frozen: 3.3.29
    hooks:
      - id: checkov
        files: (^|/)Containerfile$
        args:
          - --framework=dockerfile
          - --quiet
          - --compact
